name: Helm Chart Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.4

      - name: Validate default operator against Kubernetes API
        run: bash charts/formbricks/tests/authzed-api-server.sh

      - name: Validate online Helm and Argo manifests
        shell: bash
        run: |
          set -euo pipefail
          # Use the repository's parser version without installing the application workspace.
          parser_version=$(awk '/^  js-yaml: / { print $2 }' pnpm-workspace.yaml)
          test -n "$parser_version"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/online-chart-deps" "js-yaml@$parser_version"
          NODE_PATH="$RUNNER_TEMP/online-chart-deps/node_modules" bash charts/formbricks/tests/online-upgrade.sh
          NODE_PATH="$RUNNER_TEMP/online-chart-deps/node_modules" node scripts/container-security/inventory.mjs "$RUNNER_TEMP/image-inventory.json"

      - name: Validate chart renders
        shell: bash
        run: |
          set -euo pipefail

          chart="charts/formbricks"
          render_dir="$(mktemp -d)"
          trap 'rm -rf "$render_dir"' EXIT

          helm lint "$chart" --set formbricks.webappUrl=https://qa.example.com
          bash charts/formbricks/tests/postgresql-overrides.sh
          bash charts/formbricks/tests/authzed-operations.sh
          bash charts/formbricks/tests/authzed-security-context.sh
          bash charts/formbricks/tests/embeddings-external.sh
          bash charts/formbricks/tests/envoy-gateway.sh
          bash charts/formbricks/tests/envoy-crd-preflight.sh
          bash charts/formbricks/tests/pdb-selectors.sh
          bash charts/formbricks/tests/web-security-context.sh
          bash charts/formbricks/tests/migration-security-context.sh
          bash charts/formbricks/tests/hub-migration-wait.sh

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --show-only templates/deployment.yaml > "$render_dir/deployment-default.yaml"
          grep -q 'terminationGracePeriodSeconds: 30' "$render_dir/deployment-default.yaml"
          if grep -q '^          lifecycle:$' "$render_dir/deployment-default.yaml"; then
            echo "Expected no lifecycle block in the default render" >&2
            exit 1
          fi

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set 'deployment.extraVolumes[0].name=custom-ca' \
            --set 'deployment.extraVolumes[0].configMap.name=custom-ca' \
            --set 'deployment.extraVolumeMounts[0].name=custom-ca' \
            --set 'deployment.extraVolumeMounts[0].mountPath=/etc/ssl/formbricks-ca' \
            --set 'deployment.extraVolumeMounts[0].readOnly=true' \
            --show-only templates/deployment.yaml > "$render_dir/deployment-volumes.yaml"
          test "$(grep -c 'name: custom-ca' "$render_dir/deployment-volumes.yaml")" -eq 3
          test "$(grep -c 'mountPath: /etc/ssl/formbricks-ca' "$render_dir/deployment-volumes.yaml")" -eq 1
          test "$(grep -c 'readOnly: true' "$render_dir/deployment-volumes.yaml")" -eq 1

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set deployment.terminationGracePeriodSeconds=60 \
            --set-json 'deployment.lifecycle={"preStop":{"exec":{"command":["sh","-c","sleep 30"]}}}' \
            --show-only templates/deployment.yaml > "$render_dir/deployment-lifecycle.yaml"
          grep -q 'terminationGracePeriodSeconds: 60' "$render_dir/deployment-lifecycle.yaml"
          grep -q '^          lifecycle:$' "$render_dir/deployment-lifecycle.yaml"
          grep -q '^            preStop:$' "$render_dir/deployment-lifecycle.yaml"
          grep -q -- '- sleep 30' "$render_dir/deployment-lifecycle.yaml"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --show-only templates/deployment.yaml > "$render_dir/formbricks-default.yaml"
          if grep -q 'name: MCP_OAUTH_JWKS_URL' "$render_dir/formbricks-default.yaml"; then
            echo "MCP_OAUTH_JWKS_URL must remain opt-in"
            exit 1
          fi

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set formbricks.mcpOauthJwksUrl=http://auth-internal:3000/custom/api/auth/jwks \
            --show-only templates/deployment.yaml > "$render_dir/formbricks-jwks-value.yaml"
          grep -A1 'name: MCP_OAUTH_JWKS_URL' "$render_dir/formbricks-jwks-value.yaml" \
            | grep -q 'value: "http://auth-internal:3000/custom/api/auth/jwks"'

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set-string deployment.env.MCP_OAUTH_JWKS_URL=http://explicit:3000/api/auth/jwks \
            --show-only templates/deployment.yaml > "$render_dir/formbricks-jwks-env.yaml"
          test "$(grep -c 'name: MCP_OAUTH_JWKS_URL' "$render_dir/formbricks-jwks-env.yaml")" -eq 1
          grep -A1 'name: MCP_OAUTH_JWKS_URL' "$render_dir/formbricks-jwks-env.yaml" \
            | grep -q 'value: "http://explicit:3000/api/auth/jwks"'

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --show-only templates/cube-deployment.yaml > "$render_dir/cube-default.yaml"
          grep -A1 'name: CUBEJS_EXTERNAL_DEFAULT' "$render_dir/cube-default.yaml" \
            | grep -q 'value: "false"'

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set-string cube.env.CUBEJS_EXTERNAL_DEFAULT=true \
            --show-only templates/cube-deployment.yaml > "$render_dir/cube-external.yaml"
          grep -A1 'name: CUBEJS_EXTERNAL_DEFAULT' "$render_dir/cube-external.yaml" \
            | grep -q 'value: "true"'

          if helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set cube.replicas=2 \
            --show-only templates/cube-deployment.yaml > "$render_dir/cube-invalid.yaml" 2>&1; then
            echo "Expected the in-memory Cube configuration with multiple replicas to fail" >&2
            exit 1
          fi
          grep -q 'CUBEJS_CACHE_AND_QUEUE_DRIVER=memory is only supported when cube.replicas=1' \
            "$render_dir/cube-invalid.yaml"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --show-only templates/hub-worker-deployment.yaml > "$render_dir/hub-worker-default.yaml"
          grep -q 'max_attempts=120' "$render_dir/hub-worker-default.yaml"
          grep -q 'timeout 5 wget --no-verbose --tries=1 --timeout=5 --spider' \
            "$render_dir/hub-worker-default.yaml"
          grep -q 'Waiting for Hub API migrations and health check (attempt \$attempts/\$max_attempts)' \
            "$render_dir/hub-worker-default.yaml"
          grep -q 'Hub API did not become healthy after \$max_attempts attempt(s)' \
            "$render_dir/hub-worker-default.yaml"
          grep -q 'sleep 5' "$render_dir/hub-worker-default.yaml"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set hub.worker.waitForApi.maxAttempts=3 \
            --show-only templates/hub-worker-deployment.yaml > "$render_dir/hub-worker-override.yaml"
          grep -q 'max_attempts=3' "$render_dir/hub-worker-override.yaml"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set hub.worker.waitForApi.enabled=false \
            --show-only templates/hub-worker-deployment.yaml > "$render_dir/hub-worker-disabled.yaml"
          ! grep -q 'wait-for-hub-api' "$render_dir/hub-worker-disabled.yaml"
          grep -q '/app/hub-worker' "$render_dir/hub-worker-disabled.yaml"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set hub.embeddings.enabled=true \
            --set-string hub.embeddings.background.batchMaxWaitMs=37 \
            --show-only templates/hub-deployment.yaml \
            --show-only templates/hub-worker-deployment.yaml > "$render_dir/hub-embeddings-legacy.yaml"
          test "$(grep -c 'http://formbricks-hub-embeddings:8080/v1' "$render_dir/hub-embeddings-legacy.yaml")" -eq 2
          ! grep -q 'hub-embeddings-background:8080/v1' "$render_dir/hub-embeddings-legacy.yaml"
          grep -A1 'name: EMBEDDING_BATCH_SIZE' "$render_dir/hub-embeddings-legacy.yaml" | grep -q 'value: "1"'
          grep -A1 'name: EMBEDDING_BATCH_MAX_WAIT_MS' "$render_dir/hub-embeddings-legacy.yaml" | grep -q 'value: "25"'

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set hub.embeddings.enabled=true \
            --show-only templates/hub-deployment.yaml > "$render_dir/hub-embeddings-legacy-api.yaml"
          ! grep -q 'name: EMBEDDING_HTTP_DISABLE_KEEP_ALIVES' "$render_dir/hub-embeddings-legacy-api.yaml"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set hub.embeddings.enabled=true \
            --show-only templates/hub-worker-deployment.yaml > "$render_dir/hub-embeddings-legacy-worker.yaml"
          grep -A1 'name: EMBEDDING_HTTP_DISABLE_KEEP_ALIVES' "$render_dir/hub-embeddings-legacy-worker.yaml" | grep -q 'value: "false"'

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set hub.embeddings.enabled=true \
            --set hub.embeddings.background.enabled=true \
            --set-string hub.embeddings.background.maxConcurrent=24 \
            --set-string hub.embeddings.background.batchSize=8 \
            --set-string hub.embeddings.background.batchMaxWaitMs=25 \
            --set-string hub.embeddings.background.batchMaxInFlight=3 \
            --set-string hub.embeddings.background.httpDisableKeepAlives=true \
            --set hub.embeddings.background.persistence.storageClass=gp3 \
            --set hub.embeddings.background.autoscaling.enabled=true \
            --show-only templates/hub-deployment.yaml \
            --show-only templates/hub-worker-deployment.yaml \
            --show-only templates/hub-embeddings-background-statefulset.yaml \
            --show-only templates/hub-embeddings-background-service.yaml \
            --show-only templates/hub-hpa.yaml > "$render_dir/hub-embeddings-background.yaml"
          test "$(grep -c 'http://formbricks-hub-embeddings:8080/v1' "$render_dir/hub-embeddings-background.yaml")" -eq 1
          test "$(grep -c 'http://formbricks-hub-embeddings-background:8080/v1' "$render_dir/hub-embeddings-background.yaml")" -eq 1
          grep -A1 'name: EMBEDDING_MAX_CONCURRENT' "$render_dir/hub-embeddings-background.yaml" | grep -q 'value: "24"'
          grep -A1 'name: EMBEDDING_BATCH_SIZE' "$render_dir/hub-embeddings-background.yaml" | grep -q 'value: "8"'
          grep -q '^kind: StatefulSet$' "$render_dir/hub-embeddings-background.yaml"
          grep -q 'podManagementPolicy: Parallel' "$render_dir/hub-embeddings-background.yaml"
          test "$(grep -c 'whenScaled: Retain' "$render_dir/hub-embeddings-background.yaml")" -eq 1
          grep -q '^  volumeClaimTemplates:$' "$render_dir/hub-embeddings-background.yaml"
          grep -q 'storageClassName: "gp3"' "$render_dir/hub-embeddings-background.yaml"
          grep -A3 'kind: StatefulSet' "$render_dir/hub-embeddings-background.yaml" | grep -q 'hub-embeddings-background'
          grep -q '^  minReplicas: 1$' "$render_dir/hub-embeddings-background.yaml"
          grep -q '^  maxReplicas: 6$' "$render_dir/hub-embeddings-background.yaml"
          grep -q 'stabilizationWindowSeconds: 900' "$render_dir/hub-embeddings-background.yaml"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set hub.embeddings.enabled=true \
            --set hub.embeddings.background.enabled=true \
            --set-string hub.embeddings.background.httpDisableKeepAlives=true \
            --show-only templates/hub-deployment.yaml > "$render_dir/hub-embeddings-background-api.yaml"
          ! grep -q 'name: EMBEDDING_HTTP_DISABLE_KEEP_ALIVES' "$render_dir/hub-embeddings-background-api.yaml"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set hub.embeddings.enabled=true \
            --set hub.embeddings.background.enabled=true \
            --set-string hub.embeddings.background.httpDisableKeepAlives=true \
            --show-only templates/hub-worker-deployment.yaml > "$render_dir/hub-embeddings-background-worker.yaml"
          grep -A1 'name: EMBEDDING_HTTP_DISABLE_KEEP_ALIVES' "$render_dir/hub-embeddings-background-worker.yaml" | grep -q 'value: "true"'

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set hub.embeddings.enabled=true \
            --set hub.embeddings.background.enabled=true \
            --set-string hub.embeddings.background.httpDisableKeepAlives=true \
            --set-string hub.env.EMBEDDING_HTTP_DISABLE_KEEP_ALIVES=true \
            --set-string hub.worker.env.EMBEDDING_HTTP_DISABLE_KEEP_ALIVES=false \
            --show-only templates/hub-worker-deployment.yaml > "$render_dir/hub-embeddings-background-worker-override.yaml"
          test "$(grep -c 'name: EMBEDDING_HTTP_DISABLE_KEEP_ALIVES' "$render_dir/hub-embeddings-background-worker-override.yaml")" -eq 1
          grep -A1 'name: EMBEDDING_HTTP_DISABLE_KEEP_ALIVES' "$render_dir/hub-embeddings-background-worker-override.yaml" | grep -q 'value: "false"'

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set hub.embeddings.enabled=true \
            --set hub.embeddings.background.enabled=true \
            --set hub.embeddings.background.persistence.enabled=false \
            --show-only templates/hub-embeddings-background-statefulset.yaml > "$render_dir/hub-embeddings-background-ephemeral.yaml"
          grep -q '^      volumes:$' "$render_dir/hub-embeddings-background-ephemeral.yaml"
          grep -q 'emptyDir: {}' "$render_dir/hub-embeddings-background-ephemeral.yaml"
          ! grep -q '^  volumeClaimTemplates:$' "$render_dir/hub-embeddings-background-ephemeral.yaml"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            > "$render_dir/hub-embedding-backfill-disabled.yaml"
          ! grep -q 'app.kubernetes.io/component: hub-embedding-backfill' "$render_dir/hub-embedding-backfill-disabled.yaml"

          if helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set hub.embeddings.enabled=true \
            --set hub.embeddingBackfill.enabled=true \
            --show-only templates/hub-embedding-backfill-job.yaml > "$render_dir/hub-embedding-backfill-invalid.yaml" 2>&1; then
            echo "Expected an enabled embedding backfill without runId to fail" >&2
            exit 1
          fi
          grep -q 'hub.embeddingBackfill.runId is required' "$render_dir/hub-embedding-backfill-invalid.yaml"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set hub.embeddings.enabled=true \
            --set hub.embeddings.background.enabled=true \
            --set-string hub.embeddings.background.httpDisableKeepAlives=true \
            --set hub.embeddingBackfill.enabled=true \
            --set hub.embeddingBackfill.runId=eu-canary-001 \
            --set hub.embeddingBackfill.taxonomy=true \
            --set hub.embeddingBackfill.tenantId=tenant-a \
            --set hub.embeddingBackfill.countOnly=false \
            --set hub.embeddingBackfill.maxRecords=500 \
            --show-only templates/hub-embedding-backfill-job.yaml > "$render_dir/hub-embedding-backfill.yaml"
          grep -q '^kind: Job$' "$render_dir/hub-embedding-backfill.yaml"
          grep -q 'embedding-backfill-eu-canary-001' "$render_dir/hub-embedding-backfill.yaml"
          grep -q -- '- --taxonomy' "$render_dir/hub-embedding-backfill.yaml"
          grep -A1 -- '- --tenant-id' "$render_dir/hub-embedding-backfill.yaml" | grep -q -- '- "tenant-a"'
          grep -A1 -- '- --max-records' "$render_dir/hub-embedding-backfill.yaml" | grep -q -- '- "500"'
          test "$(grep -c 'name: EMBEDDING_HTTP_DISABLE_KEEP_ALIVES' "$render_dir/hub-embedding-backfill.yaml")" -eq 1
          grep -A1 'name: EMBEDDING_HTTP_DISABLE_KEEP_ALIVES' "$render_dir/hub-embedding-backfill.yaml" | grep -q 'value: "true"'

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --show-only templates/hub-deployment.yaml \
            --show-only templates/hub-worker-deployment.yaml > "$render_dir/hub-default.yaml"
          ! grep -q 'qa-hub-credentials' "$render_dir/hub-default.yaml"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set 'hub.extraVolumes[0].name=qa-hub-credentials' \
            --set 'hub.extraVolumes[0].secret.secretName=qa-hub-credentials' \
            --set 'hub.extraVolumeMounts[0].name=qa-hub-credentials' \
            --set 'hub.extraVolumeMounts[0].mountPath=/var/run/qa-credentials' \
            --set 'hub.extraVolumeMounts[0].readOnly=true' \
            --show-only templates/hub-deployment.yaml > "$render_dir/hub-api-volumes.yaml"
          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set 'hub.extraVolumes[0].name=qa-hub-credentials' \
            --set 'hub.extraVolumes[0].secret.secretName=qa-hub-credentials' \
            --set 'hub.extraVolumeMounts[0].name=qa-hub-credentials' \
            --set 'hub.extraVolumeMounts[0].mountPath=/var/run/qa-credentials' \
            --set 'hub.extraVolumeMounts[0].readOnly=true' \
            --show-only templates/hub-worker-deployment.yaml > "$render_dir/hub-worker-volumes.yaml"
          for manifest in "$render_dir/hub-api-volumes.yaml" "$render_dir/hub-worker-volumes.yaml"; do
            test "$(grep -c 'secretName: qa-hub-credentials' "$manifest")" -eq 1
            test "$(grep -c 'mountPath: /var/run/qa-credentials' "$manifest")" -eq 1
            test "$(grep -c 'readOnly: true' "$manifest")" -eq 1
          done

          # ENG-2599: the app Secret carries the documented BETTER_AUTH_* keys and the legacy NEXTAUTH_*
          # alias, and the secret MUST be the same value under both. formbricks.authSecret ends in
          # `randAlphaNum`, so including it twice instead of resolving it once would emit two different
          # secrets here and the legacy key would sign nothing the app ever verifies.
          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --show-only templates/secrets.yaml > "$render_dir/app-secrets.yaml"

          for key in BETTER_AUTH_SECRET NEXTAUTH_SECRET BETTER_AUTH_URL NEXTAUTH_URL; do
            test "$(grep -c "^  ${key}: " "$render_dir/app-secrets.yaml")" -eq 1
          done
          auth_secret="$(grep '^  BETTER_AUTH_SECRET: ' "$render_dir/app-secrets.yaml")"
          legacy_secret="$(grep '^  NEXTAUTH_SECRET: ' "$render_dir/app-secrets.yaml")"
          test "${auth_secret#*: }" = "${legacy_secret#*: }"
          auth_url="$(grep '^  BETTER_AUTH_URL: ' "$render_dir/app-secrets.yaml")"
          legacy_url="$(grep '^  NEXTAUTH_URL: ' "$render_dir/app-secrets.yaml")"
          test "${auth_url#*: }" = "${legacy_url#*: }"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --show-only templates/migration-job.yaml > "$render_dir/default.yaml"

          grep -q 'packages/database/dist/scripts/wait-for-database.js' "$render_dir/default.yaml"
          grep -q 'packages/database/dist/scripts/apply-migrations.js' "$render_dir/default.yaml"
          grep -q 'argocd.argoproj.io/sync-wave: "-1"' "$render_dir/default.yaml"
          test "$(grep -c '^          image: ' "$render_dir/default.yaml")" -eq 2
          test "$(grep '^          image: ' "$render_dir/default.yaml" | sort -u | wc -l | tr -d ' ')" -eq 1
          test "$(grep -c 'name: formbricks-app-secrets' "$render_dir/default.yaml")" -eq 2
          ! grep -q '^          env:$' "$render_dir/default.yaml"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set migration.waitForDatabase.enabled=false \
            --show-only templates/migration-job.yaml > "$render_dir/disabled.yaml"
          ! grep -q 'wait-for-database' "$render_dir/disabled.yaml"
          grep -q 'packages/database/dist/scripts/apply-migrations.js' "$render_dir/disabled.yaml"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set postgresql.enabled=false \
            --set-string postgresql.externalDatabaseUrl=postgresql://user:password@external-postgresql:5432/formbricks \
            --set authzed.mode=external \
            --set authzed.operator.install=false \
            --set authzed.endpoint=grpc.authzed.com:443 \
            --set authzed.auth.existingSecret=formbricks-authzed \
            --show-only templates/migration-job.yaml > "$render_dir/external.yaml"
          grep -q 'packages/database/dist/scripts/wait-for-database.js' "$render_dir/external.yaml"

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --set-string deployment.env.MIGRATE_DATABASE_URL=postgresql://user:password@migrate-postgresql:5432/formbricks \
            --show-only templates/migration-job.yaml > "$render_dir/migrate-url.yaml"
          test "$(grep -c 'name: MIGRATE_DATABASE_URL' "$render_dir/migrate-url.yaml")" -eq 2
          test "$(grep -c '^          env:' "$render_dir/migrate-url.yaml")" -eq 2

          helm template qa "$chart" \
            --set formbricks.webappUrl=https://qa.example.com \
            --show-only charts/postgresql/templates/primary/statefulset.yaml > "$render_dir/postgresql.yaml"
          grep -q 'argocd.argoproj.io/sync-wave: "-2"' "$render_dir/postgresql.yaml"

      # The render tests cannot execute the bootstrap SQL, and the SQL is where ENG-2390 actually
      # broke: an administrator holding the documented CREATEROLE and CREATEDB could not run
      # `CREATE DATABASE ... OWNER`. This runs the *rendered* script against real PostgreSQL, on both
      # sides of the 16 CREATEROLE change. It skips itself when Docker is unavailable, so the suite
      # stays runnable locally.
      - name: Validate the AuthZed bootstrap against real PostgreSQL
        shell: bash
        run: bash charts/formbricks/tests/authzed-bootstrap-runtime.sh

  integrate-envoy:
    name: Full-stack Envoy ownership on kind
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.4

